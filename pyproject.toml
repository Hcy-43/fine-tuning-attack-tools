[project]
name = "fine-tuning-attack"
version = "0.1.0"
description = "Tools for studying harmful fine-tuning attacks on aligned LLMs and defending against them with representation-based data filtering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fire>=0.7.1",
    "ipykernel>=6.30.1",
    "llama-cookbook>=0.0.5.post1",
    "markdown>=3.9",
    "matplotlib>=3.10.6",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "skorch>=1.2.0",
    "streamlit>=1.51.0",
    "trl>=0.23.0",
    "unsloth>=2025.10.1",
    "xgboost>=3.0.5",
]
